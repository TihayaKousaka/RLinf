model_type: "rlt_stage2"

model_path: "/path/to/pi05-sft-model"
precision: null
load_to_device: True

num_action_chunks: 5
action_dim: 7
policy_setup: "widowx_bridge"

is_lora: False
lora_rank: 32

add_value_head: False

rlt_stage2:
  config_name: "pi05_rlt_maniskill"
  norm_stats_path: null
  rl_token_path: "/path/to/rl_token_checkpoint.pt"
  num_images_in_input: 2
  proprio_dim: 8
  embedding_dim: 2048
  encoder_layers: 2
  encoder_heads: 8
  decoder_layers: 2
  decoder_heads: 8
  mlp_hidden_dim: 256
  mlp_num_hidden_layers: 2
  actor_noise_sigma: 0.1
  ref_action_dropout: 0.0
  target_noise_sigma: 0.2
  target_noise_clip: 0.5
  bc_regularizer_beta: 0.1
  critic_updates_per_actor: 2
  buffer_capacity: 200000
  tau: 0.005
  gamma: 0.99
