defaults:
  - env/maniskill_rlt@env.train
  - env/maniskill_rlt@env.eval
  - model/rlt_stage2@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 1-2
    rollout: 3-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rlt_stage2_maniskill"
    logger_backends: ["wandb"]

  max_epochs: 2000
  max_steps: -1
  only_eval: False
  val_check_interval: 100
  save_interval: 100
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 32
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  adv_type: rlt_td3
  loss_type: rlt_td3
  loss_agg_func: "token-mean"
  gamma: 0.99
  tau: 0.005
  critic_actor_ratio: ${actor.model.rlt_stage2.critic_updates_per_actor}
  target_update_freq: 1
  replay_buffer:
    enable_cache: True
    cache_size: 10000
    sample_window_size: 10000
    min_buffer_size: 1
    auto_save: False
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 1
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    wrap_obs_mode: rlt_openpi
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 50
    init_params:
      obs_mode: "rgb"
      reward_mode: "sparse"
  eval:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    wrap_obs_mode: rlt_openpi
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 50
    group_size: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      obs_mode: "rgb"
      reward_mode: "sparse"

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 256
  seed: 1234
  enable_offload: False
  model:
    model_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/RLinf/logs/20260517-11:25:54/rlt_maniskill_pi05_sft/checkpoints/global_step_2000/actor"
    num_action_chunks: 5
    action_dim: 7
    add_value_head: False
    policy_setup: "rlt_maniskill"
    rlt_stage2:
      config_name: "pi05_rlt_maniskill"
      norm_stats_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/pi05_base/rlt_maniskill/norm_stats.json"
      rl_token_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/results/rlt_stage1_maniskill/checkpoints/global_step_3000/actor/rl_token/rl_token_model.pt"
      num_images_in_input: 2
      proprio_dim: 8
      embedding_dim: 2048
      encoder_layers: 2
      encoder_heads: 8
      decoder_layers: 2
      decoder_heads: 8
      mlp_hidden_dim: 256
      mlp_num_hidden_layers: 2
      actor_noise_sigma: 0.1
      ref_action_dropout: 0.0
      target_noise_sigma: 0.2
      target_noise_clip: 0.5
      bc_regularizer_beta: 0.1
      critic_updates_per_actor: 2
      tau: 0.005
      gamma: 0.99

  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
