  group_name: EnvGroup
actor:
  model:
    model_type: openpi
    model_path: /mnt/public2/xiekaizhi/RLinf-Pi05-ManiSkill-25Main-SFT
    precision: null
    num_action_chunks: 5
    action_dim: 7
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 4
    add_value_head: true
    openpi:
      config_name: pi05_maniskill
      num_images_in_input: 1
      noise_level: 0.5
      action_chunk: 5
      num_steps: 4
      train_expert_only: true
      action_env_dim: 7
      noise_method: flow_noise
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: null
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 8
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
    policy_setup: widowx_bridge
    max_prompt_length: 30
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 16
  seed: 1234
  enable_offload: false
  optim:
    lr: 0.0001
    value_lr: 0.003
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    transport_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: /mnt/public2/xiekaizhi/rlt-openpi-sim/RLinf/logs/20260515-19:07:10-maniskill_collect_put_carrot_lerobot
    project_name: rlinf
    experiment_name: maniskill_collect_put_carrot_lerobot
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  nsight_output_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.0
  ratio_clip_eps: 0.2
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /mnt/public2/xiekaizhi/RLinf-Pi05-ManiSkill-25Main-SFT
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
